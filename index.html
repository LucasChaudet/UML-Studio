<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UML Studio</title>
<style>
:root{--bg:#f3f4f7;--panel:#fff;--line:#e3e6ec;--text:#1f2630;--muted:#6b7684;--accent:#3b6df0;--accent-soft:#e8eefe;--danger:#d64545}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px}
button:hover{background:#f6f8fb}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:#2f5bd6}
button.danger{color:var(--danger)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:#eef1f6}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea{resize:vertical;font-family:Consolas,"Cascadia Mono",monospace;font-size:12px}
header{height:52px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;flex:none}
.logo{font-weight:700;font-size:15px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;inset:6px;border:2px solid #fff;border-radius:2px}
#pname{width:230px;font-weight:600}
.sp{flex:1}
#status{color:var(--muted);font-size:12px;min-width:120px;text-align:right}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:38px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,30,50,.12);padding:6px;display:none;z-index:20;min-width:200px}
.menu.open .pop{display:block}
.pop button{width:100%;border:0;justify-content:flex-start}
main{flex:1;display:grid;grid-template-columns:240px 1fr 268px;min-height:0}
aside{background:var(--panel);overflow:auto;padding:12px}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
h4{margin:14px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
h4:first-child{margin-top:0}
h3{margin:0 0 10px;font-size:14px}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pal button{flex-direction:column;gap:3px;padding:8px 4px;font-size:12px;cursor:grab}
.pal svg{width:28px;height:28px;stroke:#334155;fill:none;stroke-width:1.5}
.proj{display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:8px;cursor:pointer}
.proj:hover{background:#f1f3f8}
.proj.on{background:var(--accent-soft);color:#1f3fa8;font-weight:600}
.proj span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj button{padding:0 6px;border:0;background:transparent;color:var(--muted);visibility:hidden}
.proj:hover button{visibility:visible}
.card{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbfd;margin-bottom:8px;font-size:12px}
.card.warn{background:#fff7e6;border-color:#f3d9a3}
.card p{margin:0 0 8px;color:var(--muted)}
#canvas{position:relative;overflow:hidden;background-color:#fbfbfd;background-image:radial-gradient(#d5d9e2 1px,transparent 1px);background-size:20px 20px}
#cv{width:100%;height:100%;display:block;user-select:none;font-family:"Segoe UI",Arial,sans-serif}
#cv text{pointer-events:none}
#cv.link{cursor:crosshair}
#cv.pan{cursor:grabbing}
#tools{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px rgba(20,30,50,.08);padding:4px;display:flex;gap:2px;max-width:calc(100% - 20px);overflow:auto}
#tools button{border:0;padding:4px 8px;flex-direction:column;gap:0;font-size:11px;white-space:nowrap;color:var(--muted)}
#tools button.on{background:var(--accent-soft);color:#1f3fa8}
#tools svg{display:block}
#hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#1f2630;color:#fff;padding:6px 12px;border-radius:999px;font-size:12px;display:none;pointer-events:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--muted);text-align:center}
#zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:4px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
#zoom button{padding:3px 8px}
#zoom span{min-width:42px;text-align:center;color:var(--muted)}
label{display:block;margin:10px 0 4px;font-size:12px;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid var(--line)}
.sw button.on{border-color:var(--accent)}
.btns{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
kbd{background:#eef1f6;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
.tips{color:var(--muted);font-size:12px;line-height:1.7}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2630;color:#fff;padding:8px 14px;border-radius:10px;z-index:50;font-size:12px}
dialog{border:1px solid var(--line);border-radius:14px;padding:18px;width:520px;max-width:calc(100% - 24px);color:var(--text)}
dialog::backdrop{background:rgba(20,30,50,.35)}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kinds button{flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;text-align:left}
.kinds button span{color:var(--muted);font-size:12px}
.proj small{color:var(--muted);font-weight:400;font-size:11px}
select#kind{width:auto}
#txtDlg{width:min(780px,94vw)}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:#1f3fa8;font-weight:600}
#txtNotes{margin:6px 0;padding-left:18px;color:var(--muted);font-size:12px}
#txtCode{white-space:pre;overflow:auto;font-size:12px}
#txtHelp a{color:var(--accent)}
#help{width:min(980px,94vw);height:min(720px,88vh);padding:0;overflow:hidden}
#help[open]{display:grid;grid-template-columns:210px 1fr;grid-template-rows:1fr}
#helpNav{background:#f6f8fb;border-right:1px solid var(--line);padding:14px 10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
#helpNav h4{margin:0 6px 8px}
#helpNav button{border:0;background:transparent;justify-content:flex-start;text-align:left;width:100%;padding:7px 10px}
#helpNav button.on{background:var(--accent-soft);color:#1f3fa8;font-weight:600}
#helpBody{overflow:auto;padding:22px 28px 30px;line-height:1.6;font-size:13.5px}
#helpBody h2{margin:0 0 12px;font-size:20px}
#helpBody h3{margin:22px 0 6px;font-size:14.5px}
#helpBody p,#helpBody ul,#helpBody ol{margin:6px 0}
#helpBody li{margin:3px 0}
#helpBody table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}
#helpBody th,#helpBody td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
#helpBody th{background:#f6f8fb}
#helpBody .tip{background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:10px 0}
#helpBody a{color:var(--accent);cursor:pointer;text-decoration:underline}
#helpClose{position:absolute;top:10px;right:12px}
@media(max-width:760px){#help[open]{grid-template-columns:1fr;grid-template-rows:auto 1fr}#helpNav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}#helpNav h4{display:none}#helpNav button{width:auto}}
@media(max-width:980px){main{grid-template-columns:200px 1fr 220px}#pname{width:140px}}
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>UML Studio <small style="color:var(--muted);font-weight:400" title="Numéro de version de la page">v1.14</small></div>
  <input id="pname" type="text" placeholder="Nom du projet" aria-label="Nom du projet">
  <select id="kind" aria-label="Type de diagramme"></select>
  <button class="ghost" id="undo" title="Annuler (Ctrl+Z)">↶ Annuler</button>
  <button class="ghost" id="redo" title="Rétablir (Ctrl+Y)">↷ Rétablir</button>
  <div class="sp"></div>
  <span id="status"></span>
  <button class="ghost" id="helpBtn" title="Documentation (F1)">? Aide</button>
  <button class="primary" id="exPdf">Télécharger en PDF</button>
  <div class="menu" id="menu">
    <button id="menuBtn" aria-label="Plus d'options">⋯ Plus</button>
    <div class="pop">
      <button id="exPng">Exporter en image PNG</button>
      <button id="exSvg">Exporter en SVG</button>
      <button id="exDio">Exporter pour draw.io (.drawio)</button>
      <button id="exMmd">Exporter en Mermaid (texte)</button>
      <button id="exPuml">Exporter en PlantUML (texte)</button>
      <button id="exJson">Sauvegarder le projet (.json)</button>
      <button id="imJson">Importer un projet (.json)</button>
    </div>
  </div>
  <input type="file" id="file" accept=".json,application/json" hidden>
</header>
<main>
  <aside id="left">
    <h4>Éléments <span style="text-transform:none;letter-spacing:0">(cliquer ou glisser)</span></h4>
    <div class="pal" id="pal"></div>
    <h4>Projets</h4>
    <div id="projects"></div>
    <button id="newProj" style="width:100%;justify-content:center;margin-top:6px">+ Nouveau projet</button>
    <h4>Stockage</h4>
    <div id="storage"></div>
  </aside>
  <section id="canvas">
    <svg id="cv">
      <defs>
        <marker id="m-tri" viewBox="0 0 14 12" refX="13" refY="6" markerWidth="14" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L13,6 L1,11 z" fill="#fff" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/></marker>
        <marker id="m-dia" viewBox="0 0 18 12" refX="17" refY="6" markerWidth="18" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,6 L9,1 L17,6 L9,11 z" fill="#fff" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/></marker>
        <marker id="m-diaF" viewBox="0 0 18 12" refX="17" refY="6" markerWidth="18" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,6 L9,1 L17,6 L9,11 z" fill="#334155" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/></marker>
        <marker id="m-arrowF" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#334155" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/></marker>
        <marker id="m-arrow"viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
      </defs>
      <g id="world"></g>
    </svg>
    <div id="tools"></div>
    <div id="empty"><div><div style="font-size:15px;font-weight:600;color:#3d4756">Diagramme vide</div>Ajoutez un élément depuis la colonne de gauche.</div></div>
    <div id="hint"></div>
    <div id="zoom"><button id="zOut">−</button><span id="zVal">100%</span><button id="zIn">+</button><button id="zFit">Ajuster</button></div>
  </section>
  <aside id="right"></aside>
</main>

<dialog id="dlg">
  <h3 style="margin:0">Nouveau diagramme</h3>
  <div class="kinds" id="kinds"></div>
  <div style="text-align:right"><button id="dlgCancel">Annuler</button></div>
</dialog>
<dialog id="txtDlg">
  <h3 style="margin:0 0 10px">Exporter en texte</h3>
  <div class="seg"><button data-fmt="mermaid">Mermaid</button><button data-fmt="puml">PlantUML</button></div>
  <ul id="txtNotes"></ul>
  <textarea id="txtCode" readonly rows="16" spellcheck="false"></textarea>
  <p id="txtHelp" style="margin:8px 0;color:var(--muted);font-size:12px"></p>
  <div style="display:flex;gap:8px"><button id="txtCopy" class="primary">Copier</button><button id="txtDl">Télécharger</button><button id="txtClose" style="margin-left:auto">Fermer</button></div>
</dialog>
<dialog id="help">
  <nav id="helpNav" aria-label="Sections de l'aide"></nav>
  <div id="helpBody"></div>
  <button id="helpClose" class="ghost" aria-label="Fermer l'aide">✕ Fermer</button>
</dialog>
<script>
'use strict';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const snap=v=>Math.round(v/10)*10;

/* ---------- Modèle ---------- */
const CLASSY=['class','interface','abstract'];
const TYPES={
  frame:{label:'Cadre',ico:'<rect x="3" y="5" width="22" height="18"/><path d="M3 5h11v5l-3 3H3"/>',def:{name:'frame',w:300,h:200}},
  class:{label:'Classe',ico:'<rect x="4" y="5" width="20" height="18" rx="2"/><path d="M4 11h20M4 17h20"/>',def:{name:'Classname',attrs:'+ attribute: type',methods:'+ operation(type): type',w:170}},
  interface:{label:'Interface',ico:'<rect x="4" y="5" width="20" height="18" rx="2"/><path d="M4 11h20M4 17h20M10 8h8" stroke-dasharray="2 1.5"/>',def:{name:'Interface',attrs:'',methods:'',w:170}},
  abstract:{label:'Abstraite',ico:'<rect x="4" y="5" width="20" height="18" rx="2" stroke-dasharray="3 2"/><path d="M4 11h20M4 17h20"/>',def:{name:'Classname',attrs:'',methods:'',w:170}},
  note:{label:'Note',ico:'<path d="M5 5h13l5 5v13H5z"/><path d="M18 5v5h5"/>',def:{name:'Votre note ici',w:170,h:70}},
  actor:{label:'Acteur',ico:'<circle cx="14" cy="7" r="3.5"/><path d="M14 11v8M7 14h14M14 19l-5 7M14 19l5 7"/>',def:{name:'Actor',w:50,h:100}},
  usecase:{label:'Cas d’usage',ico:'<ellipse cx="14" cy="14" rx="11" ry="7"/>',def:{name:'Use Case',w:170,h:70}},
  system:{label:'Système',ico:'<rect x="3" y="4" width="22" height="20"/><path d="M6 9h8"/>',def:{name:'Système',w:360,h:260}},
  package:{label:'Paquet',ico:'<rect x="3" y="4" width="22" height="20" rx="2"/><path d="M3 10h22"/>',def:{name:'Paquet',w:360,h:260}},
  state:{label:'État',ico:'<rect x="3" y="7" width="22" height="14" rx="6"/>',def:{name:'État',w:130,h:50}},
  start:{label:'Début',ico:'<circle cx="14" cy="14" r="5" fill="#334155"/>',def:{name:'',w:22,h:22}},
  end:{label:'Fin',ico:'<circle cx="14" cy="14" r="8"/><circle cx="14" cy="14" r="4" fill="#334155"/>',def:{name:'',w:28,h:28}},
  flowfinal:{label:'Fin de flux',ico:'<circle cx="14" cy="14" r="8"/><path d="M9 9l10 10M19 9L9 19"/>',def:{name:'',w:28,h:28}},
  activity:{label:'Activité',ico:'<rect x="3" y="5" width="22" height="18" rx="5"/><path d="M7 10h6"/>',def:{name:'Activity',w:300,h:200}},
  swimlane:{label:'Couloirs',ico:'<rect x="3" y="5" width="22" height="18"/><path d="M3 11h22M14 5v18"/>',def:{name:'Fournisseur\nEntreprise\nClient',orient:'row',w:700,h:420}},
  action:{label:'Action',ico:'<rect x="3" y="8" width="22" height="12" rx="5"/>',def:{name:'Action',w:140,h:50}},
  decision:{label:'Décision',ico:'<path d="M14 3l10 11-10 11L4 14z"/>',def:{name:'',w:50,h:50}},
  fork:{label:'Barre',ico:'<rect x="12" y="3" width="4" height="22" fill="#334155"/>',def:{name:'',w:8,h:100}},
  component:{label:'Composant',ico:'<rect x="3" y="5" width="22" height="18"/><rect x="17" y="8" width="6" height="5" fill="#fff"/>',def:{name:'Component',stereotype:'component',w:170,h:80}},
  port:{label:'Port',ico:'<rect x="9" y="9" width="10" height="10"/>',def:{name:'',w:14,h:14}},
  iface:{label:'Interface',ico:'<path d="M2 14h8"/><circle cx="14" cy="14" r="3.5"/><path d="M18 8a7 7 0 0 1 0 12"/>',def:{name:'Interface',w:70,h:24}},
  dnode:{label:'Nœud',ico:'<path d="M3 10l4-4h18v13l-4 4H3zM3 10h18v13M21 10l4-4"/>',def:{name:'Node',w:170,h:100}},
  artifact:{label:'Artefact',ico:'<rect x="3" y="5" width="22" height="18"/><path d="M17 8h4l2 2v4h-6z"/>',def:{name:'Artifact',w:150,h:60}},
  database:{label:'Base',ico:'<ellipse cx="14" cy="7" rx="9" ry="3.5"/><path d="M5 7v14c0 2 4 3.5 9 3.5s9-1.5 9-3.5V7"/>',def:{name:'Base de données',w:110,h:90}},
  lifeline:{label:'Ligne de vie',ico:'<rect x="4" y="3" width="20" height="8" rx="1"/><path d="M14 11v15" stroke-dasharray="3 2"/>',def:{name:':Application',w:110,h:360}},
  seqactor:{label:'Acteur',ico:'<circle cx="14" cy="6" r="3"/><path d="M14 9v8M8 12h12M14 17l-4 7M14 17l4 7"/>',def:{name:':Actor',w:70,h:360}},
  lentity:{label:'Entité',ico:'<circle cx="14" cy="11" r="6"/><path d="M8 20h12"/>',def:{name:':Entity',w:80,h:360}},
  lboundary:{label:'Frontière',ico:'<circle cx="16" cy="13" r="6"/><path d="M5 7v12M5 13h5"/>',def:{name:':Boundary',w:90,h:360}},
  lcontrol:{label:'Contrôle',ico:'<circle cx="14" cy="14" r="7"/><path d="M15 4l-3 3 3 3"/>',def:{name:':Control',w:90,h:360}},
  activation:{label:'Activation',ico:'<rect x="10" y="4" width="8" height="20"/>',def:{name:'',w:12,h:60}},
  destroy:{label:'Destruction',ico:'<path d="M7 7l14 14M21 7L7 21"/>',def:{name:'',w:24,h:24}},
  fragment:{label:'Fragment',ico:'<rect x="3" y="5" width="22" height="18"/><path d="M3 5h11v5l-3 3H3M9 17h10" stroke-dasharray="2 2"/>',def:{name:'loop',cond:'',w:360,h:140}},
  divider:{label:'Séparateur',ico:'<path d="M3 14h22" stroke-dasharray="4 2.5" stroke-width="2.5"/>',def:{name:'',w:360,h:12}}
};
const KINDS={
  class:{label:'Diagramme de classes',short:'Classes',desc:'Classes, interfaces, relations'},
  usecase:{label:'Cas d’utilisation',short:'Cas d’usage',desc:'Acteurs, cas, système'},
  activity:{label:'Diagramme d’activité',short:'Activité',desc:'Actions, décisions, flux'},
  component:{label:'Diagramme de composants',short:'Composants',desc:'Composants et interfaces'},
  deployment:{label:'Diagramme de déploiement',short:'Déploiement',desc:'Nœuds, artefacts, bases de données'},
  sequence:{label:'Diagramme de séquence',short:'Séquence',desc:'Lignes de vie et messages'}
};
const PAL={
  class:['frame','class','abstract','interface','note'],
  usecase:['frame','system','usecase','actor','note'],
  activity:['frame','activity','swimlane','start','action','decision','fork','end','flowfinal','note'],
  component:['frame','component','port','iface','note'],
  deployment:['frame','dnode','component','artifact','note'],
  sequence:['frame','lifeline','seqactor','lentity','lboundary','lcontrol','activation','destroy','fragment','divider','note']
};
const PKG={class:'Paquet',usecase:'Système',activity:'Partition',component:'Paquet',deployment:'Environnement',sequence:'Paquet'};
const BG=['package','system','activity','swimlane','frame','fragment','divider'];
const MOVE_GROUP=['package','system','activity','swimlane','frame'];
const SEQ_TOOLS=['sync','async','return','self','found','lost'];
const HEAD={lifeline:36,seqactor:84,lentity:58,lboundary:58,lcontrol:58};
const COLORABLE=['class','interface','abstract','note','usecase','package','state','action','decision','component','dnode','artifact','database','lifeline','port'];
const isSeq=n=>!!n&&n.type in HEAD;
const curKind=()=>cur().kind||'class';
const tlabel=t=>t==='package'?PKG[curKind()]:TYPES[t].label;
const LINKS={
  assoc:{label:'Association',end:null,k:'class usecase component deployment'},
  directed:{label:'Assoc. dirigée',end:'arrow',k:'class'},
  inherit:{label:'Héritage',end:'tri',k:'class usecase'},
  realize:{label:'Implémentation',end:'tri',dash:true,k:'class'},
  depend:{label:'Dépendance',end:'arrow',dash:true,k:'class component'},
  aggr:{label:'Agrégation',end:'dia',k:'class'},
  compo:{label:'Composition',end:'diaF',k:'class'},
  include:{label:'«include»',end:'arrow',dash:true,auto:'«include»',k:'usecase'},
  extend:{label:'«extends»',end:'arrow',dash:true,auto:'«extends»',k:'usecase'},
  flow:{label:'Flux',end:'arrow',k:'activity'},
  sync:{label:'Appel',end:'arrowF',k:'sequence'},
  async:{label:'Asynchrone',end:'arrow',k:'sequence'},
  return:{label:'Retour',end:'arrow',dash:true,k:'sequence'},
  self:{label:'Auto-appel',end:'arrowF',k:'sequence'},
  found:{label:'Message trouvé',end:'arrowF',k:'sequence'},
  lost:{label:'Message perdu',end:'arrow',k:'sequence'},
  noteLink:{label:'Lien de note',end:null,dash:true,k:'class usecase activity component deployment sequence'}

    return g+'</g>';
  }
  let d,dot=null,mx=(x1+x2)/2;
  if(e.type==='found'){d=`M${x2-80} ${y}H${x2}`;dot={x:x2-80};mx=x2-40}
  else if(e.type==='lost'){d=`M${x1} ${y}H${x1+74}`;dot={x:x1+80};mx=x1+40}
  else d=self?`M${x1} ${y}H${x1+42}V${y+22}H${x1}`:`M${x1} ${y}H${x2}`;
  const p=(w,c,extra='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" ${extra}/>`;
  let s=`<g data-id="${e.id}" data-kind="edge">`;
  if(ui)s+=p(14,'transparent');
  if(sel)s+=p(9,'#3b6df0','stroke-opacity=".25"');
  s+=p(1.5,S,(L.dash?'stroke-dasharray="7 5" ':'')+(L.end?`marker-end="url(#m-${L.end})"`:''));
  if(dot)s+=`<circle cx="${dot.x}" cy="${y}" r="4.5" fill="${S}"/>`;
  if(e.label)s+=self?txt(x1+48,y+4,e.label,{size:12,halo:1}):txt(mx,y-7,e.label,{anchor:'middle',size:12,halo:1});
  return s+'</g>';
}
function scene(ui){
  const p=cur();let s='';
  p.nodes.forEach(n=>{if(n.att){const l=N(n.att);if(l)n.x=Math.round(l.x+dims(l).w/2+n.off);else{delete n.att;delete n.off}}});
  p.nodes.filter(n=>BG.includes(n.type)).forEach(n=>s+=nodeSvg(n));
  p.edges.filter(e=>e.type!=='self').forEach(e=>s+=edgeSvg(e,ui,ui&&sel&&sel.id===e.id));
  p.nodes.filter(n=>!BG.includes(n.type)).forEach(n=>s+=nodeSvg(n));
  p.edges.filter(e=>e.type==='self').forEach(e=>s+=edgeSvg(e,ui,ui&&sel&&sel.id===e.id));
  return s;
}
function overlay(n,handle){
  const d=dims(n);
  let s=`<rect x="${n.x-4}" y="${n.y-4}" width="${d.w+8}" height="${d.h+8}" rx="4" fill="none" stroke="#3b6df0" stroke-width="1.5" stroke-dasharray="5 3" pointer-events="none"/>`;
  if(handle&&!['start','end'].includes(n.type)){
    const bar=n.type==='activation',hx=bar?n.x+d.w/2-9:n.x+d.w-5,hs=`width="${bar?18:11}" height="${bar?10:11}" rx="3" fill="#3b6df0" stroke="#fff"`;
    s+=`<rect data-id="${n.id}" data-kind="handle" x="${hx}" y="${n.y+d.h-5}" ${hs} style="cursor:${bar?'ns-resize':'nwse-resize'}"/>`;
    if(bar)s+=`<rect data-id="${n.id}" data-kind="handleT" x="${hx}" y="${n.y-5}" ${hs} style="cursor:ns-resize"/>`;
  }
  return s;
}
function renderCanvas(){
  let s=scene(true);
  if(sel&&sel.kind==='node'&&N(sel.id))s+=overlay(N(sel.id),true);
  if(linkFrom&&N(linkFrom)){
    const n=N(linkFrom),d=dims(n),sq=isSeq(n)&&SEQ_TOOLS.includes(tool);s+=overlay(n,false);
    if(mouse)s+=`<line x1="${n.x+d.w/2}" y1="${sq?mouse.y:n.y+d.h/2}" x2="${mouse.x}" y2="${mouse.y}" stroke="#3b6df0" stroke-width="1.5" stroke-dasharray="6 4" pointer-events="none"/>`;
  }

}
function applyView(){
  $('#world').setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.k})`);
  const c=$('#canvas');c.style.backgroundPosition=`${view.x}px ${view.y}px`;c.style.backgroundSize=`${20*view.k}px ${20*view.k}px`;
  $('#zVal').textContent=Math.round(view.k*100)+'%';
}
function bbox(m){
  const ns=cur().nodes;if(!ns.length)return null;
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  ns.forEach(n=>{const d=dims(n);x1=Math.min(x1,n.x);y1=Math.min(y1,n.y);x2=Math.max(x2,n.x+d.w);y2=Math.max(y2,n.y+d.h)});
  return{x:x1-m,y:y1-m,w:x2-x1+2*m,h:y2-y1+2*m};
}
function fit(){
  const b=bbox(30),r=$('#canvas').getBoundingClientRect();
  if(!b)view={x:60,y:60,k:1};
  else{const k=Math.min(1.2,r.width/b.w,r.height/b.h);view={k,x:(r.width-b.w*k)/2-b.x*k,y:(r.height-b.h*k)/2-b.y*k}}
  applyView();
}
function toWorld(e){const r=$('#canvas').getBoundingClientRect();return{x:(e.clientX-r.left-view.x)/view.k,y:(e.clientY-r.top-view.y)/view.k}}

/* ---------- Historique ---------- */
const hist={u:[],r:[],key:null,t:0};
const state=()=>JSON.stringify({nodes:cur().nodes,edges:cur().edges});
function snapshot(key){
  const t=Date.now();
  if(key&&key===hist.key&&t-hist.t<1200){hist.t=t;return}
  hist.key=key;hist.t=t;hist.u.push(state());if(hist.u.length>100)hist.u.shift();hist.r=[];
}
function restore(js){const s=JSON.parse(js);cur().nodes=s.nodes;cur().edges=s.edges;hist.key=null;
  if(sel&&!(sel.kind==='node'?N(sel.id):E(sel.id)))sel=null;renderAll();schedSave()}
function undo(){if(!hist.u.length)return;hist.r.push(state());restore(hist.u.pop())}
function redo(){if(!hist.r.length)return;hist.u.push(state());restore(hist.r.pop())}

/* ---------- Actions ---------- */
function addNode(type,x,y,useSel){
  snapshot();
  const n={id:uid(),type,x:0,y:0,color:'',...JSON.parse(JSON.stringify(TYPES[type].def))};
  const d=dims(n);n.x=snap(x-d.w/2);n.y=snap(y-d.h/2);
  if(type==='package')n.name=PKG[curKind()];
  const ls=cur().nodes.filter(isSeq);
  if(isSeq(n))n.y=ls.length?ls[0].y:snap(y-40);
  if(type==='divider'&&useSel){  /* fragment sélectionné : le séparateur le traverse en son milieu */
    const f0=sel&&sel.kind==='node'&&N(sel.id);
    if(f0&&(f0.type==='fragment'||f0.type==='frame')){n.x=f0.x;n.w=f0.w;n.y=snap(f0.y+f0.h/2)}
  }
  if(type==='activation'||type==='destroy'){
    const s0=sel&&sel.kind==='node'&&N(sel.id);  /* ligne de vie sélectionnée : on y colle la barre */
    if(useSel&&isSeq(s0)){n.x=s0.x+dims(s0).w/2-n.w/2;n.y=snap(s0.y+HEAD[s0.type]+30)}
    snapAct(n);
  }
  cur().nodes.push(n);sel={kind:'node',id:n.id};renderAll();schedSave();
}
/* Accroche une activation / destruction à la ligne de vie la plus proche : centrée,
   ou décalée d'une demi-largeur (barres imbriquées). Elle suit ensuite sa ligne de vie. */
function snapAct(n){
  const c=n.x+n.w/2,mid=m=>m.x+dims(m).w/2;
  const l=cur().nodes.filter(isSeq).sort((a,b)=>Math.abs(mid(a)-c)-Math.abs(mid(b)-c))[0];
  /* zone d'accroche : toute la largeur de la ligne de vie / de l'acteur, plus une marge */
  if(!l||Math.abs(mid(l)-c)>Math.max(30,dims(l).w/2+15)){delete n.att;delete n.off;return}
  const lc=mid(l);
  /* centrée par défaut ; décalée (barre imbriquée) seulement si elle chevauche une autre barre de cette ligne */
  const busy=cur().nodes.filter(m=>m!==n&&m.type==='activation'&&m.att===l.id&&m.y<n.y+n.h&&m.y+m.h>n.y).map(m=>m.x);
  let cand=[lc-n.w/2,lc,lc-n.w].filter(v=>!busy.some(b=>Math.abs(b-v)<2));
  if(n.type==='destroy'||!busy.length||!cand.length)cand=[lc-n.w/2];
  n.x=Math.round(cand.reduce((b,v)=>Math.abs(v-n.x)<Math.abs(b-n.x)?v:b,cand[0]));
  n.att=l.id;n.off=n.x-lc;
  const top=l.y+HEAD[l.type];if(n.y<top)n.y=top;
}
function addAtCenter(type){
  const r=$('#canvas').getBoundingClientRect(),i=cur().nodes.length%6*20;
  addNode(type,(r.width/2-view.x)/view.k+i,(r.height/2-view.y)/view.k+i,true);
}
function delSel(){
  if(!sel)return;snapshot();const p=cur();
  if(sel.kind==='node'){p.nodes=p.nodes.filter(n=>n.id!==sel.id&&n.att!==sel.id);p.edges=p.edges.filter(e=>e.from!==sel.id&&e.to!==sel.id)}
  else p.edges=p.edges.filter(e=>e.id!==sel.id);
  sel=null;renderAll();schedSave();
}
function dupSel(){
  if(!sel||sel.kind!=='node')return;snapshot();
  const c=JSON.parse(JSON.stringify(N(sel.id)));c.id=uid();c.x+=30;c.y+=30;delete c.att;delete c.off;
  cur().nodes.push(c);sel={kind:'node',id:c.id};renderAll();schedSave();
}
function setTool(t){
  tool=t;linkFrom=null;mouse=null;
  document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));
  $('#cv').classList.toggle('link',t!=='select');
  const h=$('#hint');
  if(t==='select')h.style.display='none';
  else if(t==='found'||t==='lost'||t==='self'){h.style.display='block';h.textContent=LINKS[t].label+' : cliquez la ligne de vie concernée, à la hauteur voulue · Échap pour quitter'}
  else if(SEQ_TOOLS.includes(t)){h.style.display='block';h.textContent=LINKS[t].label+' : cliquez la ligne de vie source puis la cible (la hauteur du 2ᵉ clic place le message ; on peut le glisser ensuite) · Échap pour quitter'}
  else{h.style.display='block';h.textContent=LINKS[t].label+' : cliquez la source puis la cible (la pointe va sur la cible) · Échap pour quitter'}
  renderCanvas();
}

/* ---------- Interactions canvas ---------- */
/* Cible d'un clic en mode lien : un clic sur une barre d'activation ou sur un auto-appel vise sa ligne de vie */
function linkTarget(t){
  if(!t)return null;
  const id=t.dataset.id,k=t.dataset.kind;
  if(k==='node'){const n=N(id);return n.type==='activation'&&n.att&&N(n.att)?n.att:id}
  if(k==='edge'){const ed=E(id);return ed&&ed.type==='self'&&N(ed.from)?ed.from:null}
  return null;
}
const cv=$('#cv');
let drag=null,lastDown={id:null,t:0};
cv.addEventListener('mousedown',e=>{
  if(e.button===2)return;
  const t=e.target.closest('[data-id]'),pt=toWorld(e);
  if(e.button===1){drag={type:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};cv.classList.add('pan');e.preventDefault();return}
  if(tool!=='select'){
    const tid=linkTarget(t);
    if(tid){
      const sq=SEQ_TOOLS.includes(tool);
      if(sq&&!isSeq(N(tid)))return;
      if(tool==='found'||tool==='lost'||tool==='self'){
        snapshot();const id=tid,tn=N(id),ey=Math.max(snap(pt.y),tn.y+100),ed={id:uid(),from:id,to:id,type:tool,label:'',fromMult:'',toMult:'',y:ey};
        cur().edges.push(ed);
        if(tool==='self'){ed.bh=90;ed.ih=50}
        sel={kind:'edge',id:ed.id};renderAll();schedSave();return;
      }
      if(!linkFrom){linkFrom=tid}
      else if(linkFrom!==tid||sq){
        snapshot();const ed={id:uid(),from:linkFrom,to:tid,type:tool,label:'',fromMult:'',toMult:''};
        if(sq)ed.y=Math.max(snap(pt.y),N(linkFrom).y+80);
        cur().edges.push(ed);sel={kind:'edge',id:ed.id};linkFrom=null;renderAll();schedSave();return;
      }
    }else linkFrom=null;
    renderCanvas();return;
  }
  if(t&&t.dataset.kind==='shandle'){
    const ed=E(t.dataset.id);drag={type:'sres',id:ed.id,part:t.dataset.part,sy:pt.y,ot:ed.ot??14,bh:ed.bh||90,it:ed.it??10,ih:ed.ih||50,moved:false};return;
  }
  if(t&&t.dataset.kind==='handleT'){
    const n=N(t.dataset.id);drag={type:'resizeT',id:n.id,sy:pt.y,y:n.y,h:n.h,moved:false};return;
  }
  if(t&&t.dataset.kind==='handle'){
    const n=N(t.dataset.id);drag={type:'resize',id:n.id,sx:pt.x,sy:pt.y,w:n.w,h:n.h,moved:false};return;
  }
  if(t&&t.dataset.kind==='node'){
    const n=N(t.dataset.id),now=Date.now();
    const again=lastDown.id===n.id&&now-lastDown.t<350;lastDown={id:n.id,t:now};
    sel={kind:'node',id:n.id};
    const inside=MOVE_GROUP.includes(n.type)?cur().nodes.filter(m=>{if(m===n)return false;const d=dims(m),dn=dims(n);
      return m.x>=n.x&&m.y>=n.y&&m.x+d.w<=n.x+dn.w&&m.y+d.h<=n.y+dn.h}).map(m=>({id:m.id,x:m.x,y:m.y})):isSeq(n)?cur().nodes.filter(m=>m.att===n.id).map(m=>({id:m.id,x:m.x,y:m.y})):[];
    drag={type:'move',id:n.id,sx:pt.x,sy:pt.y,x:n.x,y:n.y,moved:false,inside};
    renderAll();
    if(again){const f=$('#right [data-f=name]');if(f){f.focus();f.select()}}
    return;
  }
  if(t&&t.dataset.kind==='edge'){
    const ed=E(t.dataset.id);sel={kind:'edge',id:ed.id};
    if(ed.y!==undefined&&isSeq(N(ed.from)))drag={type:'msgy',id:ed.id,sy:pt.y,y:ed.y,moved:false};
    renderAll();return}
  sel=null;renderAll();
  drag={type:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};cv.classList.add('pan');
});
window.addEventListener('mousemove',e=>{
  if(tool!=='select'&&linkFrom){mouse=toWorld(e);renderCanvas()}
  if(!drag)return;
  if(drag.type==='pan'){view.x=drag.vx+e.clientX-drag.sx;view.y=drag.vy+e.clientY-drag.sy;applyView();return}
  const pt=toWorld(e);
  if(drag.type==='msgy'){
    const ed=E(drag.id);if(!ed)return;
    if(!drag.moved){if(Math.abs(pt.y-drag.sy)*view.k<3)return;snapshot();drag.moved=true}
    ed.y=snap(drag.y+pt.y-drag.sy);renderCanvas();return;
  }
  if(drag.type==='sres'){
    const ed=E(drag.id);if(!ed)return;
    if(!drag.moved){snapshot();drag.moved=true}
    const dy=Math.round((pt.y-drag.sy)/5)*5;
    if(drag.part==='ot'){const d=Math.min(dy,drag.bh-20);ed.ot=drag.ot-d;ed.bh=drag.bh-d}
    else if(drag.part==='ob')ed.bh=Math.max(20,drag.bh+dy);
    else if(drag.part==='it'){const d=Math.min(dy,drag.ih-20);ed.it=drag.it+d;ed.ih=drag.ih-d}
    else ed.ih=Math.max(20,drag.ih+dy);
    renderCanvas();return;
  }
  const n=N(drag.id);if(!n)return;
  if(drag.type==='resizeT'){
    if(!drag.moved){snapshot();drag.moved=true}
    const bot=drag.y+drag.h;n.y=Math.min(snap(drag.y+pt.y-drag.sy),bot-20);n.h=bot-n.y;renderCanvas();return;
  }
  if(drag.type==='move'){
    const dx=pt.x-drag.sx,dy=pt.y-drag.sy;
    if(!drag.moved&&Math.hypot(dx,dy)*view.k<3)return;
    if(!drag.moved){snapshot();drag.moved=true}
    n.x=snap(drag.x+dx);n.y=snap(drag.y+dy);
    if(n.type==='activation'||n.type==='destroy')snapAct(n);
    drag.inside.forEach(o=>{const m=N(o.id);m.x=snap(o.x+dx);m.y=snap(o.y+dy)});
  }else{
    if(!drag.moved){snapshot();drag.moved=true}
    if(n.type!=='activation')n.w=Math.max(40,snap(drag.w+pt.x-drag.sx));
    if(!CLASSY.includes(n.type)&&n.type!=='divider')n.h=Math.max(n.type==='fork'?6:n.type==='activation'?20:30,snap(drag.h+pt.y-drag.sy));
  }
  renderCanvas();
});
window.addEventListener('mouseup',()=>{
  if(!drag)return;const m=drag.moved;drag=null;cv.classList.remove('pan');
  if(m){renderProps();schedSave()}

cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=$('#canvas').getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  zoomAt(mx,my,view.k*Math.exp(-e.deltaY*.0015));
},{passive:false});
function zoomAt(mx,my,k){
  k=Math.min(3,Math.max(.2,k));
  view.x=mx-(mx-view.x)*k/view.k;view.y=my-(my-view.y)*k/view.k;view.k=k;applyView();
}
function zoomCenter(f){const r=$('#canvas').getBoundingClientRect();zoomAt(r.width/2,r.height/2,view.k*f)}
$('#zIn').onclick=()=>zoomCenter(1.2);$('#zOut').onclick=()=>zoomCenter(1/1.2);$('#zFit').onclick=fit;
cv.addEventListener('dragover',e=>e.preventDefault());
cv.addEventListener('drop',e=>{
  e.preventDefault();const t=e.dataTransfer.getData('text/plain');

});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(mod&&k==='s'){e.preventDefault();flushSave(true);return}
  if(typing)return;
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(mod&&k==='y'){e.preventDefault();redo()}
  else if(mod&&k==='d'){e.preventDefault();dupSel()}
  else if(e.key==='Delete'||e.key==='Backspace'){delSel()}
  else if(e.key==='Escape'){setTool('select');sel=null;renderAll()}
});

function fileFor(p){

  if(p.file&&new RegExp('^'+base+'(-\\d+)?\\.uml\\.json$').test(p.file))return p.file;

    try{out.push(normalize(JSON.parse(await(await h.getFile()).text()),h.name))}catch(e){console.warn('Fichier ignoré',h.name,e)}

}

}
async function pickFolder(){

    if(!found.length){for(const p of projects){await persist(p)}toast('Projets enregistrés dans « '+dir.name+' »')}

function exportSvg(){

function toCanvas(ex,sc){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(new Blob([ex.svg],{type:'image/svg+xml;charset=utf-8'}));
    img.onload=()=>{const c=document.createElement('canvas');c.width=Math.ceil(ex.w*sc);c.height=Math.ceil(ex.h*sc);
      const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c)};
    img.onerror=()=>rej(new Error('rendu de l’image impossible'));img.src=url;
  });
}
function dl(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();

const pdfStr=s=>s.replace(/[\\()]/g,'\\$&').replace(/[^\x20-\xFF]/g,'?');
async function buildPdf(){
  const ex=exportSvg();if(!ex)return null;
  const sc=Math.min(2,3500/Math.max(ex.w,ex.h)),cvs=await toCanvas(ex,sc);
  const jpg=atob(cvs.toDataURL('image/jpeg',.93).split(',')[1]);
  const land=ex.w>=ex.h,PW=land?842:595,PH=land?595:842,m=36,top=62;
  const aw=PW-2*m,ah=PH-m-top,k=Math.min(aw/ex.w,ah/ex.h,1.5);
  const dw=ex.w*k,dh=ex.h*k,x=(PW-dw)/2,y=m+(ah-dh)/2;
  const title=pdfStr(cur().name+'  -  '+new Date().toLocaleDateString('fr-FR'));
  let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const off=[];
  const obj=(n,body)=>{off[n]=out.length;out+=n+' 0 obj\n'+body+'\nendobj\n'};
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 5 0 R >> /Font << /F1 6 0 R >> >> /Contents 4 0 R >>`);
  const content=`BT /F1 13 Tf ${m} ${PH-m-6} Td (${title}) Tj ET\nq ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q`;
  obj(4,`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  obj(5,`<< /Type /XObject /Subtype /Image /Width ${cvs.width} /Height ${cvs.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n${jpg}\nendstream`);
  obj(6,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  const xr=out.length;
  out+='xref\n0 7\n0000000000 65535 f \n';
  for(let i=1;i<=6;i++)out+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  out+=`trailer\n<< /Size 7 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
  return new Blob([u],{type:'application/pdf'});
}

  const L=LINKS[e.type]||LINKS.assoc,id='e_'+e.id,lab=esc(esc(e.label||L.auto||''));
  const ARR={arrow:'endArrow=open;endFill=0;endSize=10;',tri:'endArrow=block;endFill=0;endSize=14;',dia:'endArrow=diamondThin;endFill=0;endSize=18;',diaF:'endArrow=diamondThin;endFill=1;endSize=18;',arrowF:'endArrow=block;endFill=1;'};
  let st='html=1;rounded=0;curved=0;'+(L.dash?'dashed=1;':'')+(L.end?ARR[L.end]:'endArrow=none;');
  if(isSeq(a)&&isSeq(b)){
    const se=seqEnds(e,a,b),x1=Math.round(se.x1),x2=Math.round(se.x2),y=Math.round(se.y);
    let s1=[x1,y],s2=[x2,y],pts='';
    if(e.type==='found'){s1=[x2-80,y];st+='startArrow=oval;startFill=1;'}
    else if(e.type==='lost'){s2=[x1+80,y];st=st.replace(/endArrow=\w+;endFill=\d;(endSize=\d+;)?/,'')+'endArrow=oval;endFill=1;';s1=[x1,y]}
    else if(a===b){const sf=e.type==='self';s1=[x1+(sf?6:0),y];s2=[x1+(sf?12:0),y+22];pts=`<Array as="points"><mxPoint x="${x1+42}" y="${y}"/><mxPoint x="${x1+42}" y="${y+22}"/></Array>`}
    return `<mxCell id="${id}" value="${lab}" style="${st}verticalAlign=bottom;" edge="1" parent="1"><mxGeometry relative="1" as="geometry"><mxPoint x="${s1[0]}" y="${s1[1]}" as="sourcePoint"/><mxPoint x="${s2[0]}" y="${s2[1]}" as="targetPoint"/>${pts}</mxGeometry></mxCell>`+(e.type==='self'?[[x1-6,y-(e.ot??14),e.bh||90],[x1,y+(e.it??10),e.ih||50]].map((b,i)=>`<mxCell id="${id}_b${i}" value="" style="html=1;points=[];perimeter=orthogonalPerimeter;outlineConnect=0;targetShapes=umlLifeline;portConstraint=eastwest;" vertex="1" parent="1"><mxGeometry x="${b[0]}" y="${b[1]}" width="12" height="${b[2]}" as="geometry"/></mxCell>`).join(''):'');
  }
  const m=(txt,pos,sfx)=>txt?`<mxCell id="${id}_${sfx}" value="${esc(esc(txt))}" style="edgeLabel;html=1;align=center;verticalAlign=middle;resizable=0;points=[];" vertex="1" connectable="0" parent="${id}"><mxGeometry x="${pos}" relative="1" as="geometry"><mxPoint as="offset"/></mxGeometry></mxCell>`:'';
  return `<mxCell id="${id}" value="${lab}" style="${st}" edge="1" parent="1" source="n_${a.id}" target="n_${b.id}"><mxGeometry relative="1" as="geometry"/></mxCell>`+m(e.fromMult,-0.8,'a')+m(e.toMult,0.8,'b');
}

/* ---------- Export texte : Mermaid et PlantUML ---------- */
const qp=s=>String(s||'').replace(/"/g,"'").replace(/\n/g,'\\n');          /* texte PlantUML entre guillemets */
const qm=s=>String(s||'').replace(/"/g,'#quot;').replace(/\n/g,'<br>');    /* texte Mermaid entre guillemets */
const laneBox=(sw,i)=>{const k=Math.max(lines(sw.name).length,1);
  return sw.orient==='row'?{x:sw.x,y:sw.y+sw.h/k*i,w:sw.w,h:sw.h/k}:{x:sw.x+sw.w/k*i,y:sw.y,w:sw.w/k,h:sw.h}};
const inBox=(b,n)=>{const d=dims(n),cx=n.x+d.w/2,cy=n.y+d.h/2;return cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h};
const NO_GROUP=['frame','fragment','divider','swimlane','system','package','activity','port'];
/* Regroupements : couloirs, systèmes et paquets contiennent les éléments situés dedans */
function textGroups(p){
  const gs=[];let k=0;
  p.nodes.forEach(n=>{
    if(n.type==='swimlane')lines(n.name).forEach((t,i)=>gs.push({id:'G'+(++k),title:t,box:laneBox(n,i),kind:'lane',nodes:[]}));
    else if(n.type==='system'||n.type==='package')gs.push({id:'G'+(++k),title:n.name||'',box:{x:n.x,y:n.y,w:n.w,h:n.h},kind:n.type,nodes:[]});
  });
  const top=[];
  p.nodes.forEach(n=>{
    if(NO_GROUP.includes(n.type))return;
    const g=gs.filter(g=>inBox(g.box,n)).sort((a,b)=>a.box.w*a.box.h-b.box.w*b.box.h)[0];
    (g?g.nodes:top).push(n);
  });
  return{gs,top};
}
const PU_ARROW={assoc:'--',directed:'-->',inherit:'--|>',realize:'..|>',depend:'..>',aggr:'--o',compo:'--*',include:'.>',extend:'.>',flow:'-->',noteLink:'..'};
const edgeLabel=e=>{const L=LINKS[e.type]||{};return String(e.label||L.auto||'').replace(/«/g,'<<').replace(/»/g,'>>')};

/* ----- Séquence (commun) ----- */
function seqText(p,f,out,notes){
  const L=p.nodes.filter(isSeq).sort((a,b)=>a.x-b.x),ids={};L.forEach((n,i)=>ids[n.id]='L'+(i+1));
  const nm=n=>String(n.name||'').replace(/[\n;#"]/g,' ').trim()||'Objet';
  const pad=f==='mmd'?'    ':'';
  L.forEach(n=>{
    if(f==='puml'){const kw={seqactor:'actor',lentity:'entity',lboundary:'boundary',lcontrol:'control'}[n.type]||'participant';out.push(`${kw} "${nm(n)}" as ${ids[n.id]}`)}
    else out.push(`${pad}${n.type==='seqactor'?'actor':'participant'} ${ids[n.id]} as ${nm(n)}`);
  });
  if(f==='mmd'&&L.some(n=>['lentity','lboundary','lcontrol'].includes(n.type)))notes.push('Mermaid n\'a pas de symbole pour entité / frontière / contrôle : ils sont exportés comme de simples participants.');
  const items=[];
  p.edges.forEach(e=>{if(ids[e.from]&&ids[e.to])items.push({y:e.y??0,e})});
  p.nodes.filter(n=>n.type==='note').forEach(n=>items.push({y:n.y,note:n}));
  items.sort((a,b)=>a.y-b.y);
  const before=items.map(()=>[]),after=items.map(()=>[]);
  const KW=['alt','loop','opt','par','break','critical'];
  p.nodes.filter(n=>n.type==='fragment').sort((a,b)=>b.h-a.h).forEach(fr=>{
    const idx=items.map((_,i)=>i).filter(i=>items[i].y>=fr.y&&items[i].y<=fr.y+fr.h);
    if(!idx.length){notes.push(`Le fragment « ${fr.name} » ne contient aucun message : ignoré.`);return}
    const op=String(fr.name||'').trim().toLowerCase();
    before[idx[0]].push({t:'open',kw:KW.includes(op)?op:'opt',label:KW.includes(op)?'':fr.name,cond:fr.cond||''});
    p.nodes.filter(d=>d.type==='divider'&&d.y>fr.y&&d.y<fr.y+fr.h).forEach(d=>{
      const j=idx.find(i=>items[i].y>d.y);if(j!==undefined&&j>idx[0])before[j].push({t:'else'});
    });
    if(fr.sep>0){const j=idx.find(i=>items[i].y>fr.y+fr.sep);if(j!==undefined&&j>idx[0])before[j].push({t:'else'})}
    after[idx.at(-1)].unshift({t:'end'});
  });
  p.nodes.filter(n=>n.type==='activation'&&ids[n.att]).forEach(b=>{
    const inv=items.map((_,i)=>i).filter(i=>items[i].e&&(items[i].e.from===b.att||items[i].e.to===b.att));
    const s=inv.find(i=>items[i].y>=b.y-6),e2=[...inv].reverse().find(i=>items[i].y<=b.y+b.h+6);
    if(s!==undefined&&e2!==undefined&&s<=e2){after[s].push({t:'act',id:ids[b.att]});after[e2].push({t:'deact',id:ids[b.att]})}
  });
  items.forEach((it,i)=>{if(it.e&&it.e.type==='self'){after[i].push({t:'act',id:ids[it.e.from]},{t:'deact',id:ids[it.e.from]})}});
  const stack=[];
  const emit=x=>{
    if(x.t==='open'){
      stack.push(x.kw);
      const txt=[x.label,x.cond].filter(Boolean).join(' ');
      out.push(f==='puml'?`${x.kw}${txt?' '+txt:''}`:`${pad}${x.kw}${txt?' '+txt:''}`);
    }else if(x.t==='else')out.push(`${pad}${f==='mmd'&&stack.at(-1)==='par'?'and':'else'}`);
    else if(x.t==='end'){stack.pop();out.push(`${pad}end`)}
    else if(x.t==='act')out.push(`${pad}activate ${x.id}`);
    else if(x.t==='deact')out.push(`${pad}deactivate ${x.id}`);
  };
  const title=p.nodes.find(n=>n.type==='frame');
  if(f==='puml'&&title&&title.name)out.push(`title ${qp(title.name)}`);
  items.forEach((it,i)=>{
    before[i].forEach(emit);
    if(it.note){const t=String(it.note.name||'').replace(/\n/g,f==='puml'?'\\n':'<br>');out.push(f==='puml'?`note across : ${t}`:`${pad}Note over ${ids[L[0].id]}${L.length>1?','+ids[L.at(-1).id]:''}: ${t}`)}
    else{
      const e=it.e,a=ids[e.from],b=ids[e.to],t=String(e.label||'').replace(/\n/g,' ');
      if(f==='puml'){
        const ar={sync:'->',self:'->',async:'->>',return:'-->'}[e.type]||'->';
        if(e.type==='found')out.push(`[-> ${a}${t?' : '+t:''}`);
        else if(e.type==='lost')out.push(`${a} ->]${t?' : '+t:''}`);
        else out.push(`${a} ${ar} ${b}${t?' : '+t:''}`);
      }else{
        const ar={sync:'->>',self:'->>',async:'-)',return:'-->>'}[e.type]||'->>';
        if(e.type==='found'||e.type==='lost'){out.push(`${pad}Note over ${a}: ${e.type==='found'?'message trouvé':'message perdu'}${t?' : '+t:''}`);
          if(!notes.some(n=>n.includes('trouvé')))notes.push('Mermaid n\'a pas de message trouvé / perdu : ils sont exportés sous forme de note.')}
        else out.push(`${pad}${a}${ar}${b}: ${t||' '}`);
      }
    }
    after[i].forEach(emit);
  });
  p.nodes.filter(n=>n.type==='destroy'&&ids[n.att]).forEach(n=>out.push(`${pad}destroy ${ids[n.att]}`));
}

/* ----- PlantUML ----- */
function toPlantUML(p){
  const out=['@startuml'],notes=[],k=p.kind||'class',ids={};
  p.nodes.forEach((n,i)=>ids[n.id]='N'+(i+1));
  if(k==='sequence'){seqText(p,'puml',out,notes);out.push('@enduml');return{code:out.join('\n'),notes}}
  const {gs,top}=textGroups(p);
  const mem=s=>lines(s).map(l=>'  '+l.trim());
  const declared=new Set();
  const decl=n=>{
    const id=ids[n.id],nm=qp(n.name||''),t=n.type;let r=null;
    if(k==='activity'){
      if(t==='start'||t==='end')return null;
      if(t==='action'||t==='state')r=`state "${nm}" as ${id}`;
      else if(t==='decision')r=`state ${id} <<choice>>`+(n.name?`\nnote right of ${id} : ${nm}`:'');
      else if(t==='fork')r=`state ${id} <<fork>>`;
      else if(t==='flowfinal')r=`state ${id} <<end>>`;
      else if(t==='note')r=`note "${nm}" as ${id}`;
    }else{
      if(t==='class')r=`class "${nm}" as ${id} {\n${[...mem(n.attrs),...mem(n.methods)].join('\n')}\n}`;
      else if(t==='abstract')r=`abstract class "${nm}" as ${id} {\n${[...mem(n.attrs),...mem(n.methods)].join('\n')}\n}`;
      else if(t==='interface')r=`interface "${nm}" as ${id} {\n${[...mem(n.attrs),...mem(n.methods)].join('\n')}\n}`;
      else if(t==='actor')r=`actor "${nm}" as ${id}`;
      else if(t==='usecase')r=`usecase "${nm}" as ${id}`;
      else if(t==='component')r=`component "${nm}" as ${id}`;
      else if(t==='iface')r=`interface "${nm}" as ${id}`;
      else if(t==='dnode')r=`node "${nm}" as ${id}`;
      else if(t==='artifact')r=`artifact "${nm}" as ${id}`;
      else if(t==='database')r=`database "${nm}" as ${id}`;
      else if(t==='note')r=`note "${nm}" as ${id}`;
    }
    if(r)declared.add(n.id);
    return r;
  };
  if(k==='usecase')out.push('left to right direction');
  top.forEach(n=>{const r=decl(n);if(r)out.push(r)});
  gs.forEach(g=>{
    const body=g.nodes.map(decl).filter(Boolean);
    if(!body.length&&g.kind!=='lane')return;
    out.push(`${k==='activity'?'state':g.kind==='package'?'package':'rectangle'} "${qp(g.title)}" as ${g.id} {`,...body,'}');
  });
  const ref=(n,isTarget)=>{
    if(k==='activity'&&(n.type==='start'||n.type==='end'))return '[*]';
    return declared.has(n.id)?ids[n.id]:null;
  };
  p.edges.forEach(e=>{
    const a=p.nodes.find(n=>n.id===e.from),b=p.nodes.find(n=>n.id===e.to);if(!a||!b)return;
    const ra=ref(a),rb=ref(b);if(!ra||!rb){notes.push(`Un lien vers « ${(!ra?a:b).type} » n'a pas pu être converti.`);return}
    const ar=k==='activity'?(e.type==='noteLink'?'..':'-->'):(PU_ARROW[e.type]||'--');
    const fm=k==='class'&&e.fromMult?` "${qp(e.fromMult)}"`:'',tm=k==='class'&&e.toMult?` "${qp(e.toMult)}"`:'',lb=edgeLabel(e);
    out.push(`${ra}${fm} ${ar}${tm} ${rb}${lb?' : '+qp(lb):''}`);
  });
  if(k==='activity'){
    if(p.nodes.some(n=>n.type==='fork'))notes.push('Le diagramme d\'activité est exporté au format « états » de PlantUML (le plus fidèle pour un graphe) ; les couloirs deviennent des états composites.');
    else notes.push('Le diagramme d\'activité est exporté au format « états » de PlantUML ; les couloirs deviennent des états composites.');
  }
  if(p.nodes.some(n=>n.type==='port'))notes.push('Les ports ne sont pas exportés.');
  notes.push('Les positions, tailles et couleurs ne sont pas conservées : PlantUML place les éléments automatiquement.');
  out.push('@enduml');
  return{code:out.join('\n'),notes};
}

/* ----- Mermaid ----- */
function toMermaid(p){
  const k=p.kind||'class',notes=[],out=[],ids={};
  p.nodes.forEach((n,i)=>ids[n.id]='N'+(i+1));
  const hdr='Les positions, tailles et couleurs ne sont pas conservées : Mermaid place les éléments automatiquement.';
  if(k==='sequence'){out.push('sequenceDiagram');seqText(p,'mmd',out,notes);notes.push(hdr);return{code:out.join('\n'),notes}}
  if(k==='class'){
    out.push('classDiagram');
    const names={},used=new Set();
    const cls=p.nodes.filter(n=>['class','abstract','interface'].includes(n.type));
    cls.forEach((n,i)=>{let b=String(n.name||'').replace(/[^A-Za-z0-9_]/g,'_')||'C'+(i+1),c=b,j=2;while(used.has(c))c=b+(j++);used.add(c);names[n.id]=c});
    cls.forEach(n=>{
      out.push(`    class ${names[n.id]} {`);
      if(n.type==='interface')out.push('        <<interface>>');
      if(n.type==='abstract')out.push('        <<abstract>>');
      [...lines(n.attrs),...lines(n.methods)].forEach(l=>out.push('        '+l.trim().replace(/</g,'~').replace(/>/g,'~')));
      out.push('    }');
    });
    const MR={assoc:'--',directed:'-->',inherit:'--|>',realize:'..|>',depend:'..>'};
    const linked=new Set();
    p.edges.forEach(e=>{
      const a=p.nodes.find(n=>n.id===e.from),b=p.nodes.find(n=>n.id===e.to);if(!a||!b)return;
      if(e.type==='noteLink'){const nn=a.type==='note'?a:b,t=a.type==='note'?b:a;
        if(nn.type==='note'&&names[t.id]){out.push(`    note for ${names[t.id]} "${qm(nn.name)}"`);linked.add(nn.id)}return}
      if(!names[a.id]||!names[b.id])return;
      const lb=e.label?` : ${String(e.label).replace(/\n/g,' ')}`:'';
      const q=m=>m?` "${qm(m)}"`:'';
      if(e.type==='aggr'||e.type==='compo')out.push(`    ${names[b.id]}${q(e.toMult)} ${e.type==='aggr'?'o--':'*--'}${q(e.fromMult)} ${names[a.id]}${lb}`);
      else out.push(`    ${names[a.id]}${q(e.fromMult)} ${MR[e.type]||'--'}${q(e.toMult)} ${names[b.id]}${lb}`);
    });
    p.nodes.filter(n=>n.type==='note'&&!linked.has(n.id)).forEach(n=>out.push(`    note "${qm(n.name)}"`));
    notes.push(hdr);return{code:out.join('\n'),notes};
  }
  /* activité, cas d'utilisation, composants, déploiement : organigramme (flowchart) */
  out.push(`flowchart ${k==='activity'?'TB':'LR'}`);
  if(k!=='activity')notes.push('Mermaid ne gère pas ce type de diagramme : export approximatif sous forme d\'organigramme (flowchart).');
  const {gs,top}=textGroups(p),styles=[];
  const decl=n=>{
    const id=ids[n.id],t=qm(n.name||''),ty=n.type;
    switch(ty){
      case'start':styles.push(`    style ${id} fill:#000,stroke:#000`);return`${id}((" "))`;
      case'end':return`${id}((("  ")))`;
      case'flowfinal':return`${id}(("✕"))`;
      case'action':case'state':return`${id}("${t}")`;
      case'decision':return`${id}{"${t||' '}"}`;
      case'fork':styles.push(`    style ${id} fill:#000,stroke:#000`);return`${id}[" "]`;
      case'note':return`${id}>"${t}"]`;
      case'actor':return`${id}["👤 ${t}"]`;
      case'usecase':return`${id}(["${t}"])`;
      case'component':return`${id}["«${qm(n.stereotype||'component')}»<br>${t}"]`;
      case'iface':return`${id}(("${t}"))`;
      case'dnode':return`${id}[["${t}"]]`;
      case'artifact':return`${id}["📄 ${t}"]`;
      case'database':return`${id}[("${t}")]`;
    }
    return null;
  };
  const shown=new Set();
  const line=(n,ind)=>{const r=decl(n);if(r){shown.add(n.id);out.push(ind+r)}};
  top.forEach(n=>line(n,'    '));
  gs.forEach(g=>{
    out.push(`    subgraph ${g.id}["${qm(g.title)}"]`);
    g.nodes.forEach(n=>line(n,'        '));
    out.push('    end');
  });
  const MA={assoc:'---',directed:'-->',flow:'-->',depend:'-.->',include:'-.->',extend:'-.->',realize:'-.->',inherit:'-->',noteLink:'-.-'};
  p.edges.forEach(e=>{
    if(!shown.has(e.from)||!shown.has(e.to))return;
    let lb=edgeLabel(e).replace(/<<|>>/g,m=>m==='<<'?'«':'»');if(!lb&&e.type==='inherit')lb='hérite';
    out.push(`    ${ids[e.from]} ${MA[e.type]||'-->'}${lb?`|"${qm(lb)}"|`:''} ${ids[e.to]}`);
  });
  out.push(...styles);
  if(k==='activity'&&p.nodes.some(n=>n.type==='swimlane'))notes.push('Les couloirs deviennent des sous-graphes (subgraph).');
  notes.push(hdr);
  return{code:out.join('\n'),notes};
}

/* ----- Fenêtre d'export texte ----- */
let txtFmt='mermaid';
function renderText(){
  const p=cur();let r;
  try{r=txtFmt==='mermaid'?toMermaid(p):toPlantUML(p)}catch(err){console.error(err);r={code:'',notes:['Conversion impossible : '+err.message]}}
  $('#txtCode').value=r.code;
  $('#txtNotes').innerHTML=r.notes.map(n=>`<li>${esc(n)}</li>`).join('');
  document.querySelectorAll('#txtDlg [data-fmt]').forEach(b=>b.classList.toggle('on',b.dataset.fmt===txtFmt));
  $('#txtHelp').innerHTML=txtFmt==='mermaid'
    ?'Collez le texte sur <a href="https://mermaid.live" target="_blank" rel="noopener">mermaid.live</a> ou dans un bloc <code>```mermaid</code> (GitHub, Notion, Obsidian…).'
    :'Collez le texte sur <a href="https://www.plantuml.com/plantuml" target="_blank" rel="noopener">plantuml.com/plantuml</a> ou dans l\'extension PlantUML de votre éditeur.';
}
function openText(fmt){
  if(!cur().nodes.length)return toast('Le diagramme est vide');
  txtFmt=fmt;if(!$('#txtDlg').open)$('#txtDlg').showModal();renderText();
}
$('#exMmd').onclick=()=>openText('mermaid');
$('#exPuml').onclick=()=>openText('puml');
$('#txtDlg').addEventListener('click',e=>{
  const b=e.target.closest('[data-fmt]');if(b){txtFmt=b.dataset.fmt;renderText()}
  if(e.target===$('#txtDlg'))$('#txtDlg').close();
});
$('#txtClose').onclick=()=>$('#txtDlg').close();
$('#txtCopy').onclick=async()=>{
  const t=$('#txtCode').value;
  try{await navigator.clipboard.writeText(t)}catch{$('#txtCode').select();document.execCommand('copy')}
  toast('Texte copié');
};

/* ---------- Aide / documentation ---------- */
const HELP=[
{id:'start',t:'Démarrer',h:`
<p>UML Studio sert à dessiner des diagrammes UML directement dans le navigateur. Tout est enregistré automatiquement.</p>
<ol>
<li><b>Créer un diagramme</b> : cliquez sur <b>+ Nouveau projet</b> (colonne de gauche) et choisissez le type. Vous pourrez le changer plus tard avec la liste située à côté du nom.</li>
<li><b>Nommer le projet</b> : champ en haut, à côté du logo.</li>
<li><b>Ajouter des éléments</b> : cliquez sur un élément de la palette « Éléments » (à gauche) ou glissez-le sur la zone de dessin.</li>
<li><b>Les relier</b> : choisissez un type de lien dans la barre du haut, puis cliquez l'élément de départ et l'élément d'arrivée.</li>
<li><b>Modifier</b> : cliquez sur un élément ou un lien, ses propriétés s'affichent à droite (nom, texte, taille, couleur…).</li>
<li><b>Exporter</b> : <b>Télécharger en PDF</b> en haut à droite, les autres formats sont dans <b>⋯ Plus</b>.</li>
</ol>
<div class="tip">Cette aide s'ouvre à tout moment avec le bouton <b>? Aide</b> ou la touche <b>F1</b>. Le numéro de version de la page est affiché à côté du logo.</div>
<h3>Se déplacer dans le dessin</h3>
<ul><li><b>Molette</b> : zoom. Boutons − / + / <b>Ajuster</b> en bas à droite (Ajuster montre tout le diagramme).</li>
<li><b>Glisser le fond</b> (ou le bouton du milieu de la souris) : déplacer la vue.</li></ul>`},

{id:'types',t:'Types de diagrammes',h:`
<p>La notation est celle du cours : <i>uml.slides.pierre-jehan.com</i>. La palette et la barre de liens changent selon le type du projet.</p>
<table><tr><th>Type</th><th>Éléments</th><th>Liens</th></tr>
<tr><td><b>Classes</b></td><td>Cadre, classe, abstraite, interface, note</td><td>Association, assoc. dirigée, héritage, implémentation, dépendance, agrégation, composition</td></tr>
<tr><td><b>Cas d'utilisation</b></td><td>Cadre, système, cas, acteur, note</td><td>Association, héritage (généralisation), «include», «extends»</td></tr>
<tr><td><b>Activité</b></td><td>Cadre, activité, couloirs, début, action, décision, barre fork/join, fin, fin de flux, note</td><td>Flux</td></tr>
<tr><td><b>Composants</b></td><td>Cadre, composant, port, interface, note</td><td>Association, dépendance</td></tr>
<tr><td><b>Déploiement</b></td><td>Cadre, nœud, composant, artefact, note</td><td>Association</td></tr>
<tr><td><b>Séquence</b></td><td>Cadre, ligne de vie, acteur, entité, frontière, contrôle, activation, destruction, fragment, séparateur, note</td><td>Appel, asynchrone, retour, auto-appel, message trouvé, message perdu</td></tr></table>
<p>Le <b>lien de note</b> (trait pointillé) relie une note à n'importe quel élément, dans tous les types.</p>
<p>Détails : <a data-h="seq">séquence</a>, <a data-h="act">activité</a>, <a data-h="cls">classes et cas d'utilisation</a>.</p>`},

{id:'edit',t:'Éléments et liens',h:`
<h3>Éléments</h3>
<ul>
<li><b>Sélectionner</b> : un clic. Les propriétés apparaissent à droite.</li>
<li><b>Renommer</b> : double-clic sur l'élément, ou champ « Nom » à droite.</li>
<li><b>Déplacer</b> : glisser l'élément. Il se cale sur une grille de 10 px. Déplacer un cadre, un système, une activité ou des couloirs emmène les éléments qui sont entièrement dedans.</li>
<li><b>Redimensionner</b> : poignée bleue en bas à droite de l'élément sélectionné (ou champs Largeur / Hauteur).</li>
<li><b>Couleur</b> : pastilles dans les propriétés (pour les éléments qui en ont une).</li>
<li><b>Dupliquer</b> / <b>Supprimer</b> : boutons dans les propriétés, ou Ctrl+D / Suppr.</li>
<li><b>Cadres, systèmes, fragments, activités, couloirs</b> : ce sont des formes creuses. Attrapez-les par leur <b>bordure</b> ou leur onglet ; l'intérieur reste libre pour les éléments et le déplacement de la vue.</li>
</ul>
<h3>Liens</h3>
<ol>
<li>Cliquez un type de lien dans la barre du haut (il reste actif tant que vous ne revenez pas à <b>Sélection</b> ou n'appuyez pas sur Échap).</li>
<li>Cliquez l'élément de <b>départ</b>, puis l'élément d'<b>arrivée</b>. La pointe (flèche, triangle, losange) se place sur le <b>2ᵉ élément cliqué</b>.</li>
<li>Cliquez le lien pour lui donner un <b>libellé</b> (par exemple « oui », « [stock &gt; 0] ») et, pour les diagrammes qui le permettent, des <b>multiplicités</b>.</li>
<li><b>Inverser le sens</b> : bouton dans les propriétés du lien.</li>
</ol>
<div class="tip">Plusieurs liens entre les deux mêmes éléments (par exemple un aller-retour) sont automatiquement écartés pour ne pas se superposer.</div>`},

{id:'cls',t:'Classes et cas d\'utilisation',h:`
<h3>Diagramme de classes</h3>
<ul>
<li>Saisissez les <b>attributs</b> et les <b>méthodes</b> dans les propriétés, <b>une par ligne</b> (par exemple <code>- id: int</code>, <code>+ getNom(): String</code>). Les classes s'agrandissent toutes seules pour afficher le texte.</li>
<li><b>Abstraite</b> et <b>Interface</b> affichent leur stéréotype « Abstract » / « Interface ».</li>
<li><b>Héritage</b> et <b>Implémentation</b> : cliquez la classe fille puis la classe mère (le triangle se place sur la mère). L'implémentation est en pointillé.</li>
<li><b>Agrégation</b> et <b>Composition</b> : cliquez la partie puis le tout (le losange se place sur le tout).</li>
<li>Les <b>multiplicités</b> (1, 0..*, *) se saisissent des deux côtés du lien.</li>
</ul>
<h3>Cas d'utilisation</h3>
<ul>
<li>Le <b>système</b> est le grand rectangle dont le nom s'écrit en haut à gauche. Placez les cas dedans.</li>
<li>Les acteurs se relient aux cas par une <b>association</b>.</li>
<li><b>«include»</b> et <b>«extends»</b> : cliquez le cas de départ puis le cas visé ; le libellé s'ajoute tout seul.</li>
<li><b>Héritage</b> : généralisation entre deux acteurs ou deux cas.</li>
</ul>`},

{id:'act',t:'Diagramme d\'activité',h:`
<ul>
<li><b>Début</b> (disque noir), <b>Action</b>, <b>Décision</b> (losange), <b>Barre</b> (fork/join), <b>Fin</b> (fin d'activité) et <b>Fin de flux</b> (cercle barré).</li>
<li><b>Flux</b> : reliez les éléments dans l'ordre. Mettez la condition de garde en libellé (« oui », « non », « [devis validé] »).</li>
<li><b>Décision</b> : tapez le texte de la question dans son nom ; il s'affiche dans le losange.</li>
<li><b>Barre fork/join</b> : verticale par défaut. Redimensionnez-la avec la poignée pour la rendre horizontale ou plus longue.</li>
</ul>
<h3>Couloirs</h3>
<ul>
<li>Posez l'élément <b>Couloirs</b> : par défaut 3 lignes (Fournisseur, Entreprise, Client), de haut en bas.</li>
<li>Dans les propriétés : un <b>nom par ligne</b> pour ajouter ou retirer des couloirs, et l'<b>orientation</b> (lignes horizontales ou colonnes verticales).</li>
<li>Agrandissez le cadre avec la poignée bleue, puis placez vos actions dans le bon couloir. Déplacer les couloirs emmène les éléments qui sont dedans.</li>
</ul>
<h3>Activité (cadre arrondi)</h3>
<p>L'élément <b>Activité</b> est un grand rectangle arrondi avec un titre en haut à gauche, pour encadrer tout le diagramme.</p>`},

{id:'seq',t:'Diagramme de séquence',h:`
<h3>Lignes de vie</h3>
<ul>
<li><b>Ligne de vie</b>, <b>Acteur</b>, <b>Entité</b>, <b>Frontière</b> et <b>Contrôle</b> : écrivez le nom avec les deux-points habituels (<code>:Application</code>). Elles s'alignent automatiquement en haut.</li>
<li>Pour allonger une ligne de vie, utilisez la poignée bleue ou le champ « Hauteur ».</li>
</ul>
<h3>Messages</h3>
<ol>
<li>Choisissez <b>Appel</b>, <b>Asynchrone</b> ou <b>Retour</b> dans la barre du haut.</li>
<li>Cliquez la ligne de vie (ou la barre d'activation) de <b>départ</b>, puis celle d'<b>arrivée</b>. La <b>hauteur du 2ᵉ clic</b> place le message.</li>
<li>Glissez ensuite le message vers le haut ou le bas pour l'ajuster, et écrivez son libellé à droite.</li>
</ol>
<ul>
<li><b>Message trouvé</b> / <b>perdu</b> : un seul clic sur la ligne de vie, à la hauteur voulue.</li>
<li>Quand un message tombe à la hauteur d'une barre d'activation ou d'un auto-appel, la flèche s'accroche au <b>bord de la barre</b> automatiquement.</li>
</ul>
<h3>Auto-appel</h3>
<ul>
<li>Choisissez <b>Auto-appel</b>, puis cliquez <b>une seule fois</b> sur la ligne de vie : cela crée un bloc (flèche qui revient + barre d'activation + barre imbriquée).</li>
<li>Glissez le bloc pour le monter ou le descendre. Sélectionné, il affiche <b>4 poignées bleues</b> : haut et bas de chaque barre. Les champs de droite permettent des valeurs précises.</li>
<li>Vous pouvez le cliquer comme départ ou arrivée d'un autre message.</li>
</ul>
<h3>Activations et destruction</h3>
<ul>
<li><b>Activation</b> : sélectionnez d'abord la ligne de vie, puis cliquez <b>Activation</b> dans la palette (ou glissez la barre sur la ligne de vie). Elle se centre et s'<b>accroche</b> : elle suit la ligne de vie quand vous la déplacez.</li>
<li>Une barre posée sur une autre se décale pour former une barre <b>imbriquée</b>.</li>
<li>Pour l'allonger : poignées bleues en haut et en bas, ou boutons « Haut +20 », « Bas +20 » dans les propriétés.</li>
<li><b>Destruction</b> (X) : même principe, toujours centrée.</li>
</ul>
<h3>Fragments (alt, loop, opt…)</h3>
<ul>
<li>Posez un <b>Fragment</b> et saisissez l'opérateur (<code>alt</code>, <code>loop</code>…) et la condition dans les propriétés.</li>
<li>Pour le trait pointillé « else » : sélectionnez le fragment puis cliquez <b>Séparateur</b> (barre du haut ou palette). Glissez-le à la bonne hauteur.</li>
<li>Le <b>Cadre</b> sert à titrer tout le diagramme (par exemple « sd Ajout au panier »).</li>
</ul>`},

{id:'save',t:'Enregistrer ses projets',h:`
<h3>Enregistrement automatique</h3>
<p>Chaque modification est enregistrée en moins d'une seconde (message « Enregistré » en haut). <b>Ctrl+S</b> force l'enregistrement.</p>
<h3>Où sont les projets ?</h3>
<ul>
<li><b>Dans le navigateur</b> (par défaut) : pratique, mais lié à ce navigateur et à l'adresse de la page. Si vous videz les données du navigateur ou changez d'adresse, ils ne suivent pas.</li>
<li><b>Dans un dossier</b> : cliquez <b>Choisir un dossier…</b> (colonne de gauche, section Stockage). Chaque projet devient un fichier <code>nom.uml.json</code> dans ce dossier. Si le dossier est vide, vos projets actuels y sont copiés ; sinon ceux du dossier sont chargés.</li>
</ul>
<div class="tip">Le choix d'un dossier fonctionne sur <b>Chrome</b> et <b>Edge</b> uniquement. Après avoir fermé le navigateur, un bouton <b>Reconnecter le dossier</b> peut apparaître : cliquez-le pour autoriser à nouveau l'accès.</div>
<h3>Gérer les projets</h3>
<ul>
<li>Cliquez un projet dans la liste pour l'ouvrir. Le <b>✕</b> à droite le supprime (le fichier du dossier aussi, après confirmation).</li>
<li>Renommer le projet renomme son fichier.</li>
<li><b>Sauvegarder le projet (.json)</b> et <b>Importer un projet (.json)</b> (menu ⋯ Plus) permettent de faire une copie ou de déplacer un projet vers un autre ordinateur.</li>
</ul>`},

{id:'export',t:'Exporter',h:`
<table><tr><th>Format</th><th>Usage</th></tr>
<tr><td><b>PDF</b></td><td>Page A4 (paysage ou portrait selon le diagramme) avec le nom du projet et la date. Bouton « Télécharger en PDF ».</td></tr>
<tr><td><b>PNG</b></td><td>Image sur fond blanc, haute définition.</td></tr>
<tr><td><b>SVG</b></td><td>Image vectorielle, modifiable dans un logiciel de dessin.</td></tr>
<tr><td><b>draw.io</b></td><td>Fichier <code>.drawio</code> avec des formes modifiables. Dans draw.io : Fichier &gt; Ouvrir depuis &gt; Cet appareil, ou glissez le fichier dans la fenêtre. L'aspect de quelques formes peut légèrement différer.</td></tr>
<tr><td><b>Mermaid</b></td><td>Texte à coller dans mermaid.live, GitHub, Notion, Obsidian… Bien adapté aux diagrammes de <b>classes</b>, de <b>séquence</b> et d'<b>activité</b> ; approximatif pour les autres. Menu ⋯ Plus &gt; Exporter en Mermaid.</td></tr>
<tr><td><b>PlantUML</b></td><td>Texte à coller dans plantuml.com ou l'extension PlantUML de votre éditeur. Gère les <b>six</b> types de diagrammes. Menu ⋯ Plus &gt; Exporter en PlantUML.</td></tr>
<tr><td><b>JSON</b></td><td>Sauvegarde du projet pour le réimporter dans UML Studio.</td></tr></table>
<p>L'export contient tout le diagramme, quel que soit le zoom ou la partie visible. Les poignées et la sélection n'apparaissent pas dans les exports.</p>`},

{id:'keys',t:'Raccourcis clavier',h:`
<table><tr><th>Touche</th><th>Action</th></tr>
<tr><td><kbd>F1</kbd></td><td>Ouvrir l'aide</td></tr>
<tr><td><kbd>Suppr</kbd> ou <kbd>Retour arrière</kbd></td><td>Supprimer la sélection</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd></td><td>Annuler (jusqu'à 100 actions)</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>Y</kbd> ou <kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>Z</kbd></td><td>Rétablir</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>D</kbd></td><td>Dupliquer l'élément sélectionné</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>S</kbd></td><td>Enregistrer maintenant</td></tr>
<tr><td><kbd>Échap</kbd></td><td>Quitter le mode lien et désélectionner</td></tr>
<tr><td>Double-clic</td><td>Renommer un élément</td></tr>
<tr><td>Molette</td><td>Zoom</td></tr></table>`},

{id:'faq',t:'Problèmes fréquents',h:`
<table><tr><th>Problème</th><th>Solution</th></tr>
<tr><td>Je ne vois pas une nouveauté</td><td>Vous ouvrez peut-être une ancienne copie du fichier. Comparez le numéro de version à côté du logo avec celui annoncé, et rechargez la page (F5). Le site en ligne est toujours à jour.</td></tr>
<tr><td>Je n'arrive pas à reprendre un cadre / fragment</td><td>Cliquez sur sa <b>bordure</b> ou sur son onglet, pas à l'intérieur. Utilisez <b>Ajuster</b> si son bord est hors de l'écran.</td></tr>
<tr><td>Les flèches se superposent</td><td>Elles sont écartées automatiquement quand elles relient les mêmes éléments. Sinon, déplacez un des éléments.</td></tr>
<tr><td>Une activation ne se colle pas à la ligne de vie</td><td>Sélectionnez la ligne de vie avant de cliquer <b>Activation</b>, ou lâchez la barre sur la ligne de vie.</td></tr>
<tr><td>Le bouton « Choisir un dossier » n'existe pas</td><td>Utilisez Chrome ou Edge. Sinon, passez par « Sauvegarder le projet (.json) ».</td></tr>
<tr><td>Mes projets ont disparu</td><td>Les projets du navigateur sont liés à l'adresse de la page et à ce navigateur. Rouvrez la même adresse, ou rechargez le dossier d'enregistrement. Pensez à faire des sauvegardes .json.</td></tr>
<tr><td>Un message n'est pas à la bonne hauteur</td><td>Glissez-le verticalement, ou sélectionnez-le puis déplacez-le avec la souris.</td></tr>
<tr><td>Message « Enregistrement impossible »</td><td>Le dossier n'est plus accessible : cliquez « Reconnecter le dossier » ou choisissez-en un autre.</td></tr></table>`}
];
function showHelp(id){
  const s=HELP.find(x=>x.id===id)||HELP[0];
  $('#helpNav').innerHTML='<h4>Documentation</h4>'+HELP.map(x=>`<button data-h="${x.id}" class="${x.id===s.id?'on':''}">${x.t}</button>`).join('');
  $('#helpBody').innerHTML=`<h2>${s.t}</h2>`+s.h;$('#helpBody').scrollTop=0;
}
function openHelp(id){const d=$('#help');if(!d.open)d.showModal();showHelp(id||'start')}
$('#helpBtn').onclick=()=>openHelp();
$('#helpClose').onclick=()=>$('#help').close();
$('#help').addEventListener('click',e=>{
  const a=e.target.closest('[data-h]');if(a)return showHelp(a.dataset.h);
  if(e.target===$('#help'))$('#help').close();
});
document.addEventListener('keydown',e=>{if(e.key==='F1'){e.preventDefault();openHelp()}});

/* ---------- Démarrage ---------- */
(async function init(){
  bindPalette();initKinds();
  let h=null;try{h=await idbGet('dir')}catch{}
  if(h){
    ws.dir=h;ws.name=h.name;
    try{
      if(await h.queryPermission({mode:'readwrite'})==='granted'){ws.mode='folder';projects=await loadFolder()}
      else{ws.needPerm=true;loadLocal()}
    }catch{ws.needPerm=true;ws.mode='local';loadLocal()}
  }else loadLocal();
  ensureOne();openProject(projects[0].id);
})();
</script>
